spring.application.name=gym-fitness-center
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=gymfitnessdb;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USER:gymapp}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.thymeleaf.cache=false
spring.mvc.format.date=iso
spring.web.resources.cache.period=0

app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:Admin123!}
app.bootstrap.reception-password=${APP_RECEPTION_PASSWORD:Recepcion123!}
