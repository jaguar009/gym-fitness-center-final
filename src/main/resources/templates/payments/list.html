<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Pagos')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><p class="eyebrow">MOVIMIENTOS</p><h1>Pagos</h1></div><a class="btn btn-primary" th:href="@{/payments/new}">Registrar pago</a></div><form class="filter-bar row g-2 mb-3" method="get" th:action="@{/payments}"><div class="col-md-4"><label class="form-label">Desde</label><input class="form-control" type="date" name="from" th:value="${from}"></div><div class="col-md-4"><label class="form-label">Hasta</label><input class="form-control" type="date" name="to" th:value="${to}"></div><div class="col-md-2"><label class="form-label">Método</label><select class="form-select" name="method"><option value="">Todos</option><option value="EFECTIVO" th:selected="${method == 'EFECTIVO'}">Efectivo</option><option value="YAPE" th:selected="${method == 'YAPE'}">Yape</option><option value="TARJETA" th:selected="${method == 'TARJETA'}">Tarjeta</option><option value="TRANSFERENCIA" th:selected="${method == 'TRANSFERENCIA'}">Transferencia</option></select></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-outline-primary w-100">Filtrar</button></div></form><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Fecha</th><th>Miembro</th><th>Monto</th><th>Método</th><th>Concepto</th><th></th></tr></thead><tbody><tr th:each="payment : ${payments}"><td th:text="${payment.fechaPago}"></td><td th:text="${payment.member.nombres + ' ' + payment.member.apellidos}"></td><td th:text="${payment.monto}"></td><td th:text="${payment.metodoPago}"></td><td th:text="${payment.concepto}"></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/payments/{id}/edit(id=${payment.id})}">Editar</a> <form class="d-inline" sec:authorize="hasRole('ADMIN')" th:action="@{/payments/{id}/delete(id=${payment.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(payments)}"><td colspan="6" class="text-center py-4 text-muted">No hay pagos para el filtro seleccionado.</td></tr></tbody></table></div></main></body></html>
