<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Registrar pago')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4 narrow"><p class="eyebrow">MOVIMIENTO</p><h1 th:text="${payment.id == null ? 'Registrar pago' : 'Editar pago'}"></h1><form class="form-card mt-4" th:action="@{/payments}" th:object="${payment}" method="post"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li></ul></div><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-7"><label class="form-label">Miembro</label><select class="form-select" name="memberId" required><option value="">Seleccionar</option><option th:each="member : ${members}" th:value="${member.id}" th:text="${member.nombres + ' ' + member.apellidos}" th:selected="${payment.member != null ? payment.member.id == member.id : selectedMemberId == member.id}"></option></select></div><div class="col-md-5"><label class="form-label">Monto</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{monto}" required></div><div class="col-md-4"><label class="form-label">Fecha</label><input class="form-control" type="date" th:field="*{fechaPago}" required></div><div class="col-md-4"><label class="form-label">Método</label><select class="form-select" th:field="*{metodoPago}"><option value="EFECTIVO">EFECTIVO</option><option value="YAPE">YAPE</option><option value="TARJETA">TARJETA</option><option value="TRANSFERENCIA">TRANSFERENCIA</option></select></div><div class="col-md-4"><label class="form-label">Concepto</label><input class="form-control" th:field="*{concepto}"></div></div><div class="mt-4"><button class="btn btn-primary">Guardar pago</button> <a class="btn btn-link" th:href="@{/payments}">Cancelar</a></div></form></main></body></html>
