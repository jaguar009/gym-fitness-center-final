<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Empleados')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Empleados</h1></div><a class="btn btn-primary" th:href="@{/employees/new}">Nuevo empleado</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>DNI</th><th>Nombre</th><th>Cargo</th><th>Contacto</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="employee : ${employees}"><td th:text="${employee.dni}"></td><td th:text="${employee.nombres + ' ' + employee.apellidos}"></td><td th:text="${employee.cargo}"></td><td th:text="${employee.correo}"></td><td th:text="${employee.estado}"></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/employees/{id}/edit(id=${employee.id})}">Editar</a><form class="d-inline" th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Desactivar</button></form></td></tr><tr th:if="${#lists.isEmpty(employees)}"><td colspan="6" class="text-center py-4 text-muted">No hay empleados registrados.</td></tr></tbody></table></div></main></body></html>
