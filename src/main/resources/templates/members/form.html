<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Datos del miembro')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4 narrow"><p class="eyebrow">MAESTRO DE MIEMBROS</p><h1 th:text="${member.id == null ? 'Nuevo miembro' : 'Editar miembro'}"></h1>
<form class="form-card mt-4" th:action="@{/members}" th:object="${member}" method="post"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li></ul></div>
<input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-4"><label class="form-label">DNI</label><input class="form-control" th:field="*{dni}" required></div><div class="col-md-4"><label class="form-label">Nombres</label><input class="form-control" th:field="*{nombres}" required></div><div class="col-md-4"><label class="form-label">Apellidos</label><input class="form-control" th:field="*{apellidos}" required></div><div class="col-md-6"><label class="form-label">Correo</label><input class="form-control" type="email" th:field="*{correo}"></div><div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" th:field="*{telefono}"></div><div class="col-md-8"><label class="form-label">Dirección</label><input class="form-control" th:field="*{direccion}"></div><div class="col-md-4"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}"><option value="ACTIVO">ACTIVO</option><option value="INACTIVO">INACTIVO</option></select></div></div><div class="mt-4"><button class="btn btn-primary">Guardar</button> <a class="btn btn-link" th:href="@{/members}">Cancelar</a></div>
</form></main></body></html>
