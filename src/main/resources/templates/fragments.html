<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Gym Fitness Center'">Gym Fitness Center</title>
    <link th:href="@{/vendor/bootstrap.min.css}" rel="stylesheet">
    <script defer th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">Gym Fitness Center</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/members}">Miembros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/memberships}">Membresías</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/payments}">Pagos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/attendance}">Asistencia</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/classes}">Clases</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/queries}">Consultas</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/employees}">Empleados</a></li>
            </ul>
            <span class="navbar-text me-3" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Salir</button></form>
        </div>
    </div>
</nav>
</body>
</html>
