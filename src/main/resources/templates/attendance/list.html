<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Asistencia')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><p class="eyebrow">CONTROL DE ACCESO</p><h1>Asistencia</h1></div><a class="btn btn-primary" th:href="@{/attendance/new}">Registrar asistencia</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Fecha</th><th>Hora</th><th>Miembro</th><th>Observación</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${attendance}"><td th:text="${item.fecha}"></td><td th:text="${item.horaEntrada}"></td><td th:text="${item.member.nombres + ' ' + item.member.apellidos}"></td><td th:text="${item.observacion}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/attendance/{id}/edit(id=${item.id})}">Editar</a> <form class="d-inline" sec:authorize="hasRole('ADMIN')" th:action="@{/attendance/{id}/delete(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr><tr th:if="${#lists.isEmpty(attendance)}"><td colspan="5" class="text-center py-4 text-muted">No hay registros.</td></tr></tbody></table></div></main></body></html>
