<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Registrar asistencia')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4 narrow"><p class="eyebrow">CONTROL DE ACCESO</p><h1 th:text="${attendanceItem.id == null ? 'Registrar asistencia' : 'Editar asistencia'}"></h1><form class="form-card mt-4" th:action="@{/attendance}" th:object="${attendanceItem}" method="post"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li></ul></div><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-7"><label class="form-label">Miembro</label><select class="form-select" name="memberId" required><option value="">Seleccionar</option><option th:each="member : ${members}" th:value="${member.id}" th:text="${member.nombres + ' ' + member.apellidos}" th:selected="${attendanceItem.member != null ? attendanceItem.member.id == member.id : selectedMemberId == member.id}"></option></select></div><div class="col-md-5"><label class="form-label">Fecha</label><input class="form-control" type="date" th:field="*{fecha}" required></div><div class="col-md-4"><label class="form-label">Hora de entrada</label><input class="form-control" th:field="*{horaEntrada}" placeholder="07:30"></div><div class="col-md-8"><label class="form-label">Observación</label><input class="form-control" th:field="*{observacion}"></div></div><div class="mt-4"><button class="btn btn-primary">Guardar asistencia</button> <a class="btn btn-link" th:href="@{/attendance}">Cancelar</a></div></form></main></body></html>
