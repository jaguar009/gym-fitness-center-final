<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Inicio de sesión')}"></head>
<body class="login-page">
<main class="login-card">
    <h1>Gym Fitness Center</h1>
    <p class="text-muted">Gestión de miembros, pagos y clases</p>
    <div class="alert alert-danger" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
    <div class="alert alert-success" th:if="${param.logout}">Sesión cerrada correctamente.</div>
    <form th:action="@{/login}" method="post">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-control mb-3" id="username" name="username" required autofocus>
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control mb-4" id="password" name="password" type="password" required>
        <button class="btn btn-primary w-100">Ingresar</button>
    </form>
    <small class="text-muted d-block mt-3">Solicita tus credenciales al administrador del gimnasio.</small>
</main>
</body>
</html>
