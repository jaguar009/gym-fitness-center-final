<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Membresías')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><p class="eyebrow">MAESTRO</p><h1>Membresías</h1></div><a class="btn btn-primary" th:href="@{/memberships/new}">Nueva membresía</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Miembro</th><th>Tipo</th><th>Inicio</th><th>Fin</th><th>Costo</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="item : ${memberships}"><td th:text="${item.member.nombres + ' ' + item.member.apellidos}"></td><td th:text="${item.tipo}"></td><td th:text="${item.fechaInicio}"></td><td th:text="${item.fechaFin}"></td><td th:text="${item.costo}"></td><td><span class="status" th:text="${item.estado}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/memberships/{id}/edit(id=${item.id})}">Editar</a><form class="d-inline" sec:authorize="hasRole('ADMIN')" th:action="@{/memberships/{id}/delete(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar membresía?')">Desactivar</button></form></td></tr><tr th:if="${#lists.isEmpty(memberships)}"><td colspan="7" class="text-center py-4 text-muted">No hay membresías registradas.</td></tr></tbody></table></div></main></body></html>
