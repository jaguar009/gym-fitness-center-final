<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Datos de membresía')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4 narrow"><p class="eyebrow">MAESTRO DE MEMBRESÍAS</p><h1 th:text="${membership.id == null ? 'Nueva membresía' : 'Editar membresía'}"></h1><form class="form-card mt-4" th:action="@{/memberships}" th:object="${membership}" method="post"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li></ul></div><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Miembro</label><select class="form-select" name="memberId" required><option value="">Seleccionar</option><option th:each="member : ${members}" th:value="${member.id}" th:text="${member.nombres + ' ' + member.apellidos}" th:selected="${membership.member != null and membership.member.id == member.id}"></option></select></div><div class="col-md-6"><label class="form-label">Tipo</label><select class="form-select" th:field="*{tipo}"><option value="Mensual">Mensual</option><option value="Trimestral">Trimestral</option><option value="Anual">Anual</option></select></div><div class="col-md-4"><label class="form-label">Costo</label><input class="form-control" type="number" min="0.01" step="0.01" th:field="*{costo}" required></div><div class="col-md-4"><label class="form-label">Fecha de inicio</label><input class="form-control" type="date" th:field="*{fechaInicio}"></div><div class="col-md-4"><label class="form-label">Fecha de fin</label><input class="form-control" type="date" th:field="*{fechaFin}"></div><div class="col-md-4"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}"><option value="ACTIVO">ACTIVO</option><option value="VENCIDO">VENCIDO</option><option value="INACTIVO">INACTIVO</option></select></div></div><div class="mt-4"><button class="btn btn-primary">Guardar</button> <a class="btn btn-link" th:href="@{/memberships}">Cancelar</a></div></form></main></body></html>
