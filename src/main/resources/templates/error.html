<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Aviso del sistema')}"></head>
<body><main class="container py-5 narrow"><h1 th:text="${status == 403 ? 'Acceso restringido' : 'No se pudo completar la operación'}"></h1>
<p th:text="${status == 403 ? 'Tu rol no tiene permiso para acceder a esta sección.' : (message != null ? message : 'Regresa al panel y revisa los datos ingresados.')}" ></p>
<a class="btn btn-primary" th:href="@{/dashboard}">Volver al panel</a></main></body></html>
