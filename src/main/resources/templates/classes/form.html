<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Datos de clase')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4 narrow"><p class="eyebrow">PROGRAMACIÓN</p><h1 th:text="${gymClass.id == null ? 'Nueva clase' : 'Editar clase'}"></h1><form class="form-card mt-4" th:action="@{/classes}" th:object="${gymClass}" method="post"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}"><ul class="mb-0"><li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li></ul></div><input type="hidden" th:field="*{id}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required></div><div class="col-md-6"><label class="form-label">Horario</label><input class="form-control" th:field="*{horario}" placeholder="Lunes y miércoles 18:00"></div><div class="col-md-8"><label class="form-label">Descripción</label><input class="form-control" th:field="*{descripcion}"></div><div class="col-md-4"><label class="form-label">Cupos</label><input class="form-control" type="number" min="1" th:field="*{cupos}" required></div><div class="col-md-8"><label class="form-label">Instructor</label><select class="form-select" name="employeeId"><option value="">Sin asignar</option><option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.nombres + ' ' + employee.apellidos}" th:selected="${gymClass.employee != null and gymClass.employee.id == employee.id}"></option></select></div><div class="col-md-4"><label class="form-label">Estado</label><select class="form-select" th:field="*{estado}"><option value="ACTIVO">ACTIVO</option><option value="INACTIVO">INACTIVO</option></select></div></div><div class="mt-4"><button class="btn btn-primary">Guardar</button> <a class="btn btn-link" th:href="@{/classes}">Cancelar</a></div></form></main></body></html>
