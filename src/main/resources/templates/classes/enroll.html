<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Inscripción a clase')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4 narrow"><p class="eyebrow">CASO TRANSACCIONAL</p><h1>Inscribir miembro</h1><p class="text-muted">Clase: <b th:text="${gymClass.nombre}"></b> · Cupos disponibles: <b th:text="${gymClass.cuposDisponibles}"></b></p><form class="form-card mt-4" th:action="@{/classes/{id}/enroll(id=${gymClass.id})}" method="post"><label class="form-label">Miembro activo</label><select class="form-select" name="memberId" required><option value="">Seleccionar</option><option th:each="member : ${members}" th:if="${member.estado == 'ACTIVO'}" th:value="${member.id}" th:text="${member.nombres + ' ' + member.apellidos}"></option></select><div class="mt-4"><button class="btn btn-primary">Registrar inscripción</button> <a class="btn btn-link" th:href="@{/classes}">Cancelar</a></div></form><section class="content-section mt-4"><h2>Inscripciones de la clase</h2><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><table class="table"><thead><tr><th>Miembro</th><th>Fecha</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="enrollment : ${enrollments}"><td th:text="${enrollment.member.nombres + ' ' + enrollment.member.apellidos}"></td><td th:text="${enrollment.fechaInscripcion}"></td><td th:text="${enrollment.estado}"></td><td><form th:if="${enrollment.estado == 'ACTIVO'}" th:action="@{/classes/{id}/enrollments/{enrollmentId}/cancel(id=${gymClass.id},enrollmentId=${enrollment.id})}" method="post"><button class="btn btn-sm btn-outline-secondary">Cancelar inscripción</button></form></td></tr></tbody></table></section></main></body></html>
