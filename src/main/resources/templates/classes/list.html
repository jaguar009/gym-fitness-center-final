<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments :: head('Clases')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><p class="eyebrow">PROGRAMACIÓN</p><h1>Clases</h1></div><a class="btn btn-primary" th:href="@{/classes/new}">Nueva clase</a></div><div class="alert alert-success" th:if="${success}" th:text="${success}"></div><div class="alert alert-danger" th:if="${error}" th:text="${error}"></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Clase</th><th>Horario</th><th>Instructor</th><th>Capacidad</th><th>Ocupados</th><th>Disponibles</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="item : ${classes}"><td><b th:text="${item.nombre}"></b><small class="d-block text-muted" th:text="${item.descripcion}"></small></td><td th:text="${item.horario}"></td><td th:text="${item.employee != null ? item.employee.nombres + ' ' + item.employee.apellidos : 'Sin asignar'}"></td><td th:text="${item.cupos}"></td><td th:text="${item.cuposOcupados}"></td><td th:text="${item.cuposDisponibles}"></td><td><span class="status" th:text="${item.estado}"></span></td><td class="text-end"><a class="btn btn-sm btn-outline-primary" th:href="@{/classes/{id}/enroll(id=${item.id})}">Inscribir</a> <a class="btn btn-sm btn-outline-secondary" th:href="@{/classes/{id}/edit(id=${item.id})}">Editar</a><form class="d-inline" sec:authorize="hasRole('ADMIN')" th:action="@{/classes/{id}/delete(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Desactivar</button></form></td></tr><tr th:if="${#lists.isEmpty(classes)}"><td colspan="8" class="text-center py-4 text-muted">No hay clases registradas.</td></tr></tbody></table></div></main></body></html>
